# Garage, the S3-compatible object storage of the stack (service "storage" in
# docker-compose.yml). One node, one copy of every object: the server's disk is the
# only place the data lives, so it belongs in the backup (volumes storage-meta and
# storage-data). The RPC secret and the admin token come from the environment
# (GARAGE_RPC_SECRET, GARAGE_ADMIN_TOKEN), never from this file.
#
# `python -m modellbahn.cli init-storage` (Compose job "storage-init") assigns the node
# its role and creates the buckets and the access key of the backend.

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

# 0.0.0.0 rather than [::]: hosts without IPv6 would refuse the IPv6 wildcard.
rpc_bind_addr = "0.0.0.0:3901"
rpc_public_addr = "127.0.0.1:3901"

# Uploads (presigned PUT through Caddy) and the backend's own reads and writes.
[s3_api]
s3_region = "garage"
api_bind_addr = "0.0.0.0:3900"
root_domain = ".s3.garage.localhost"

# Public read access to buckets with website access enabled: Caddy serves the
# rendered image sizes under /medien from here.
[s3_web]
bind_addr = "0.0.0.0:3902"
root_domain = ".web.garage.localhost"
index = "index.html"

# Used by init-storage only; the token comes from GARAGE_ADMIN_TOKEN.
[admin]
api_bind_addr = "0.0.0.0:3903"
